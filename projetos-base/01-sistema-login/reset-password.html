<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <title>LojaQA | Redefinir Senha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
    <a href="login.html" class="back-to-store">← Voltar para o login</a>
    
    <div class="login-brand">
        <a href="loja.html">Loja<span>QA</span></a>
    </div>

    <h2>Redefinir Senha</h2>
    <p class="subtitle">Informe a nova senha e confirme o token enviado por e-mail.</p>
    
    <div class="form-group">
        <label for="reset-email">E-mail</label>
        <input type="email" id="reset-email" readonly style="background: #f8fafc; color: var(--muted);">
    </div>
    
    <div class="form-group">
        <label for="reset-token">Token</label>
        <input type="text" id="reset-token" readonly style="background: #f8fafc; color: var(--muted);">
    </div>
    
    <div class="form-group">
        <label for="reset-password">Nova senha</label>
        <div class="password-input-group">
            <input type="password" id="reset-password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('reset-password')" aria-label="Mostrar ou ocultar senha">
                <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
                    <line x1="2" x2="22" y1="2" y2="22"/>
                </svg>
            </button>
        </div>
    </div>
    
    <button class="btn" onclick="submitReset()">Redefinir Senha</button>
    
    <div class="error-message" id="resetError"></div>
    <div class="status-message" id="resetStatus"></div>
    
    <div class="login-links">
        <a href="login.html">Voltar para Login</a>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const isPassword = input.type === 'password';
    input.type = isPassword ? 'text' : 'password';
    
    const container = input.closest('.password-input-group');
    if (container) {
        const eyeOpen = container.querySelector('.icon-eye');
        const eyeOff = container.querySelector('.icon-eye-off');
        if (eyeOpen && eyeOff) {
            eyeOpen.style.display = isPassword ? 'none' : 'block';
            eyeOff.style.display = isPassword ? 'block' : 'none';
        }
    }
}

function getQueryParam(name) {
    const params = new URLSearchParams(window.location.search);
    return params.get(name) || '';
}

function showError(msg) {
    const el = document.getElementById('resetError');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('resetStatus').style.display = 'none';
}

function showStatus(msg) {
    const el = document.getElementById('resetStatus');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('resetError').style.display = 'none';
}

window.addEventListener('load', () => {
    const email = getQueryParam('email');
    const token = getQueryParam('token');
    document.getElementById('reset-email').value = decodeURIComponent(email);
    document.getElementById('reset-token').value = token;
});

async function submitReset() {
    const email = document.getElementById('reset-email').value.trim().toLowerCase();
    const token = document.getElementById('reset-token').value.trim();
    const password = document.getElementById('reset-password').value;

    if (!email || !token || !password) return showError('E-mail, token e nova senha são obrigatórios.');
    if (password.length < 8) return showError('A senha deve conter no mínimo 8 caracteres.');

    try {
        const response = await fetch('https://api-qa-fap2026.onrender.com/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, token, password })
        });
        const data = await response.json();
        if (response.ok) {
            showStatus(data.message || 'Senha redefinida com sucesso.');
        } else {
            showError(data.error || 'Não foi possível redefinir a senha.');
        }
    } catch (err) {
        showError('Erro de comunicação com a API.');
    }
}
</script>
</body>
</html>
