<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel | LojaQA</title>
    <link rel="stylesheet" href="painel.css">
</head>
<body>
    <header class="panel-header"><a class="brand" href="loja.html">Loja<span>QA</span></a><div class="header-actions"><span id="userSummary"></span><button id="logoutButton" class="ghost-button" type="button">Sair</button></div></header>
    <main class="panel-layout">
        <aside class="panel-nav"><p class="eyebrow">ÁREA AUTENTICADA</p><h1 id="panelTitle">Meu painel</h1><span class="role-badge" id="roleBadge"></span><nav id="panelNav"></nav></aside>
        <section class="panel-content">
            <div id="notice" class="notice"></div>
            <section id="profileSection" class="panel-section"><div class="section-title"><div><p class="eyebrow">CONTA</p><h2>Seu perfil</h2></div></div><div class="metric-grid" id="profileMetrics"></div></section>
            <section id="ordersSection" class="panel-section"><div class="section-title"><div><p class="eyebrow">HISTÓRICO</p><h2>Meus pedidos</h2></div></div><div id="ordersList" class="data-list"></div></section>
            <section id="checkoutSection" class="panel-section hidden"><div class="section-title"><div><p class="eyebrow">ÚLTIMO PASSO</p><h2>Finalizar compra</h2></div></div><form id="checkoutForm" class="checkout-form"><label>Endereço de entrega<textarea id="shippingAddress" maxlength="300" required placeholder="Rua, número, bairro, cidade"></textarea></label><button class="primary-button" type="submit">Confirmar pedido</button></form></section>
            <section id="sellerSection" class="panel-section hidden"><div class="section-title"><div><p class="eyebrow">LOJA</p><h2>Produtos da minha loja</h2></div><button class="primary-button" id="newProductButton" type="button">Novo produto</button></div><form id="productForm" class="product-form hidden"><input id="productId" type="hidden"><input id="productName" maxlength="120" placeholder="Nome do produto" required><input id="productCategory" maxlength="60" placeholder="Categoria" required><input id="productPrice" type="number" min="0" step="0.01" placeholder="Preço" required><input id="productStock" type="number" min="0" step="1" placeholder="Estoque" required><textarea id="productDescription" maxlength="1000" placeholder="Descrição"></textarea><input id="productImage" type="url" placeholder="URL da imagem"><div><button class="primary-button" type="submit">Salvar produto</button><button class="ghost-button" id="cancelProductButton" type="button">Cancelar</button></div></form><div id="sellerProducts" class="data-list"></div><div class="section-title subheading"><div><p class="eyebrow">OPERAÇÃO</p><h2>Pedidos da loja</h2></div></div><div id="sellerOrders" class="data-list"></div></section>
            <section id="adminSection" class="panel-section hidden"><div class="section-title"><div><p class="eyebrow">PLATAFORMA</p><h2>Visão geral</h2></div></div><div class="metric-grid" id="adminMetrics"></div><div class="section-title subheading"><div><p class="eyebrow">CONTROLE GLOBAL</p><h2>Usuários e produtos</h2></div></div><div id="adminUsers" class="data-list"></div><div id="adminProducts" class="data-list"></div></section>
        </section>
    </main>
    <script src="painel.js"></script>
</body>
</html>
