<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Área Restrita</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<script>
    // Route Guard: Validar autenticação de forma segura
    (async function() {
        const token = localStorage.getItem('token');
        const isAuthenticated = localStorage.getItem('isAuthenticated');
        
        // Primeira verificação: dados básicos no localStorage
        if (isAuthenticated !== 'true' || !token) {
            localStorage.clear();
            window.location.href = 'index.html';
            return;
        }
        
        // Segunda verificação: validar token com o backend
        try {
            const response = await fetch('https://api-qa-fap2026.onrender.com/api/users', {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (!response.ok || response.status === 401 || response.status === 403) {
                throw new Error('Token inválido');
            }
        } catch (error) {
            // Token inválido ou expirado
            localStorage.clear();
            window.location.href = 'index.html';
        }
    })();
    
    // Prevenir navegação para trás após logout
    if (window.history && window.history.pushState) {
        window.history.pushState(null, null, window.location.href);
        window.onpopstate = function() {
            if (!localStorage.getItem('token')) {
                window.location.href = 'index.html';
            }
        };
    }
</script>

<div class="navbar">
    <h2>Sistema Interno</h2>
    <button class="btn btn-logout" onclick="logout()">Sair (Logout)</button>
</div>

<div class="container">
    <h1>Bem-vindo, <span id="userName">Usuário</span>!</h1>
    
    <div class="card">
        <h3>Seus Dados de Sessão</h3>
        <p><strong>Nível de Acesso:</strong> <span id="userRole" class="badge">Carregando...</span></p>
        <p>A autenticação foi realizada com sucesso e o token JWT foi gerado.</p>
    </div>

    <!-- Painel Admin Atualizado com a Tabela -->
    <div class="card" id="adminPanel" style="display: none; border-left: 4px solid #166534;">
        <h3>Painel Exclusivo de Administração</h3>
        <p>Acesso liberado apenas para perfis administradores.</p>
        <button class="btn" style="background: #166534; width: auto;" onclick="loadUsers()">Gerenciar Usuários</button>
        
        <!-- Área onde a lista de usuários vai aparecer -->
        <div id="usersContainer" style="display: none; margin-top: 20px;">
            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin-bottom: 15px;">
            <h4>Gerenciamento de Usuários</h4>

            <div class="admin-toolbar">
                <input id="userSearchInput" type="text" placeholder="Buscar por nome ou e-mail" />
                <select id="userRoleFilter">
                    <option value="all">Todos os perfis</option>
                    <option value="admin">Admin</option>
                    <option value="user">Usuário</option>
                    <option value="blocked">Bloqueado</option>
                </select>
            </div>

            <div id="usersSummary" class="users-summary"></div>
            <div id="usersList" class="users-list"></div>
            <div id="paginationControls" class="pagination"></div>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://api-qa-fap2026.onrender.com/api';
    const userData = JSON.parse(localStorage.getItem('currentUser'));
    const token = localStorage.getItem('token');
    const TEST_USERS = ['admin@system.com', 'user@system.com', 'blocked@system.com', 'slow@system.com'];
    const state = {
        users: [],
        filteredUsers: [],
        currentPage: 1,
        perPage: 5,
        search: '',
        role: 'all'
    };
    
    if (userData) {
        document.getElementById('userName').textContent = userData.name || userData.email;
        const roleSpan = document.getElementById('userRole');
        roleSpan.textContent = (userData.role || 'user').toUpperCase();
        
        if (userData.role === 'admin') {
            roleSpan.classList.add('admin');
            document.getElementById('adminPanel').style.display = 'block';
        }
    }

    function applyFilters() {
        const search = state.search.toLowerCase();
        state.filteredUsers = state.users.filter(user => {
            const matchesSearch = !search || `${user.name || ''} ${user.email || ''}`.toLowerCase().includes(search);
            const matchesRole = state.role === 'all' || user.role === state.role;
            return matchesSearch && matchesRole;
        });
        state.currentPage = 1;
    }

    function renderPagination() {
        const controls = document.getElementById('paginationControls');
        const totalPages = Math.max(1, Math.ceil(state.filteredUsers.length / state.perPage));

        if (totalPages <= 1) {
            controls.innerHTML = '';
            return;
        }

        controls.innerHTML = `
            <button class="pagination-btn" ${state.currentPage === 1 ? 'disabled' : ''} onclick="changePage(${state.currentPage - 1})">Anterior</button>
            <span class="pagination-info">Página ${state.currentPage} de ${totalPages}</span>
            <button class="pagination-btn" ${state.currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${state.currentPage + 1})">Próxima</button>
        `;
    }

    function changePage(page) {
        const totalPages = Math.max(1, Math.ceil(state.filteredUsers.length / state.perPage));
        state.currentPage = Math.min(totalPages, Math.max(1, page));
        renderUsers();
    }

    function renderUsers() {
        const list = document.getElementById('usersList');
        const summary = document.getElementById('usersSummary');
        const start = (state.currentPage - 1) * state.perPage;
        const pageUsers = state.filteredUsers.slice(start, start + state.perPage);

        summary.textContent = `${state.filteredUsers.length} usuário(s) encontrado(s)`;

        if (!state.filteredUsers.length) {
            list.innerHTML = '<div class="empty-state">Nenhum usuário encontrado para os filtros selecionados.</div>';
            renderPagination();
            return;
        }

        list.innerHTML = pageUsers.map(user => {
            const badgeClass = user.role === 'admin' ? 'badge admin' : user.role === 'blocked' ? 'badge blocked' : 'badge';
            const selectedRole = user.role || 'user';
            const isBlocked = user.role === 'blocked';
            const testUsers = ['admin@system.com', 'user@system.com', 'blocked@system.com', 'slow@system.com'];
            const isTestUser = testUsers.includes((user.email || '').toLowerCase());
            const disabledAttribute = isTestUser ? 'disabled' : '';
            const disabledClass = isTestUser ? 'disabled-card' : '';
            return `
                <article class="user-card ${disabledClass}">
                    <button class="user-card-toggle" type="button" onclick="toggleCard(this.closest('.user-card'))">
                        <div>
                            <strong>${(user.name || 'Sem nome').replace(/</g, '&lt;')}</strong>
                            <div class="user-card-email">${(user.email || '-').replace(/</g, '&lt;')}</div>
                        </div>
                        <div class="user-card-meta">
                            <span class="${badgeClass}">${(user.role || 'user').toUpperCase()}</span>
                            <span class="toggle-icon">▸</span>
                        </div>
                    </button>
                    <div class="user-card-body">
                        ${isTestUser ? '<div class="user-card-note">Usuário de teste – edição bloqueada. Somente leitura.</div>' : ''}
                        <div class="user-card-grid">
                            <label>
                                <span>Nome</span>
                                <input data-field="name" type="text" value="${(user.name || '').replace(/"/g, '&quot;')}" placeholder="Nome" ${disabledAttribute}>
                            </label>
                            <label>
                                <span>E-mail</span>
                                <input data-field="email" type="email" value="${(user.email || '').replace(/"/g, '&quot;')}" placeholder="E-mail" ${disabledAttribute}>
                            </label>
                            <label>
                                <span>Perfil</span>
                                <select data-field="role" ${disabledAttribute}>
                                    <option value="user" ${selectedRole === 'user' ? 'selected' : ''}>Usuário</option>
                                    <option value="admin" ${selectedRole === 'admin' ? 'selected' : ''}>Admin</option>
                                    <option value="blocked" ${selectedRole === 'blocked' ? 'selected' : ''}>Bloqueado</option>
                                </select>
                            </label>
                            <label>
                                <span>Nova senha</span>
                                <input data-field="password" type="password" placeholder="Digite a nova senha" ${disabledAttribute}>
                            </label>
                            <label>
                                <span>Senha do admin</span>
                                <input data-field="adminPassword" type="password" placeholder="Obrigatória para admin" ${disabledAttribute}>
                            </label>
                        </div>
                        <div class="user-card-actions">
                            <button class="btn btn-small" onclick="saveUser('${user._id}', this)" ${isTestUser ? 'disabled' : ''}>Salvar</button>
                            ${(!isTestUser && isBlocked) ? `<button class="btn btn-small btn-success" onclick="unlockUser('${user._id}', this)">Desbloquear</button>` : ''}
                        </div>
                    </div>
                </article>
            `;
        }).join('');

        renderPagination();
    }

    function toggleCard(card) {
        card.classList.toggle('is-open');
    }

    async function loadUsers() {
        const btn = document.querySelector('#adminPanel button');
        const usersContainer = document.getElementById('usersContainer');
        const list = document.getElementById('usersList');

        usersContainer.style.display = 'block';
        list.innerHTML = '<div class="empty-state">Carregando usuários...</div>';
        btn.textContent = 'Carregando...';
        btn.disabled = true;

        try {
            const response = await fetch(`${API_URL}/users`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                const users = await response.json();
                state.users = users;
                applyFilters();
                renderUsers();
                btn.textContent = 'Atualizar Lista';
            } else {
                const error = await response.json();
                alert('Erro ao buscar usuários: ' + (error.error || 'Falha desconhecida'));
                btn.textContent = 'Gerenciar Usuários';
            }
        } catch (e) {
            alert('Erro de comunicação com a API.');
            btn.textContent = 'Gerenciar Usuários';
        } finally {
            btn.disabled = false;
        }
    }

    async function saveUser(userId, button) {
        const card = button.closest('.user-card');
        const nameInput = card.querySelector('input[data-field="name"]');
        const emailInput = card.querySelector('input[data-field="email"]');
        const roleSelect = card.querySelector('select[data-field="role"]');
        const passwordInput = card.querySelector('input[data-field="password"]');
        const adminPasswordInput = card.querySelector('input[data-field="adminPassword"]');

        const isTestUser = TEST_USERS.includes(emailInput.value.trim().toLowerCase());
        if (isTestUser) {
            alert('Este usuário de teste não pode ser alterado.');
            return;
        }

        button.disabled = true;
        button.textContent = 'Salvando...';

        try {
            const payload = {
                name: nameInput.value.trim(),
                email: emailInput.value.trim().toLowerCase(),
                role: roleSelect.value
            };

            if (passwordInput.value) {
                payload.password = passwordInput.value;
            }

            if (roleSelect.value === 'admin') {
                if (!adminPasswordInput.value) {
                    alert('Informe a senha do administrador para promover alguém a admin.');
                    button.disabled = false;
                    button.textContent = 'Salvar';
                    return;
                }
                payload.adminPassword = adminPasswordInput.value;
            }

            const response = await fetch(`${API_URL}/users/${userId}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                alert(data.message || 'Usuário atualizado com sucesso.');
                await loadUsers();
            } else {
                alert(data.error || 'Erro ao atualizar usuário.');
                button.disabled = false;
                button.textContent = 'Salvar';
            }
        } catch (e) {
            alert('Erro de comunicação com a API.');
            button.disabled = false;
            button.textContent = 'Salvar';
        }
    }

    async function unlockUser(userId, button) {
        const card = button.closest('.user-card');
        const nameInput = card.querySelector('input[data-field="name"]');
        const emailInput = card.querySelector('input[data-field="email"]');

        const isTestUser = TEST_USERS.includes(emailInput.value.trim().toLowerCase());
        if (isTestUser) {
            alert('Este usuário de teste não pode ser alterado.');
            return;
        }

        button.disabled = true;
        button.textContent = 'Desbloqueando...';

        try {
            const response = await fetch(`${API_URL}/users/${userId}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    name: nameInput.value.trim(),
                    email: emailInput.value.trim().toLowerCase(),
                    role: 'user'
                })
            });

            const data = await response.json();

            if (response.ok) {
                alert(data.message || 'Usuário desbloqueado com sucesso.');
                await loadUsers();
            } else {
                alert(data.error || 'Erro ao desbloquear usuário.');
                button.disabled = false;
                button.textContent = 'Desbloquear';
            }
        } catch (e) {
            alert('Erro de comunicação com a API.');
            button.disabled = false;
            button.textContent = 'Desbloquear';
        }
    }

    function logout() {
        // Limpar todas as sessões de forma segura
        localStorage.clear();
        sessionStorage.clear();
        
        // Redirecionar para login
        window.location.href = 'index.html';
    }

    document.getElementById('userSearchInput').addEventListener('input', (event) => {
        state.search = event.target.value;
        applyFilters();
        renderUsers();
    });

    document.getElementById('userRoleFilter').addEventListener('change', (event) => {
        state.role = event.target.value;
        applyFilters();
        renderUsers();
    });

    if (userData?.role === 'admin') {
        loadUsers();
    }
</script>
</body>
</html>
